name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: JS syntax check
        run: for f in app/src/main/assets/{app,crypto,db,i18n,groups}.js; do node --check "$f"; done
      - name: Verify vendored libraries
        run: sha256sum -c app/src/main/assets/LIBS.sha256
      - name: Crypto tests
        run: node --test tests/crypto.test.js tests/groups.test.js

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Signing key (stable key from repository secrets, if configured)
        env:
          KS_B64: ${{ secrets.SHILA_KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/shila.jks"
            echo "KS_FILE=$RUNNER_TEMP/shila.jks" >> "$GITHUB_ENV"
            echo "KS_ALIAS=shila" >> "$GITHUB_ENV"
          else
            echo "::warning::SHILA_KS_B64 secret missing - APK is signed with a throwaway debug key and cannot update an installed copy"
          fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.SHILA_KS_PASS }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shilagram-apk
          path: app/build/outputs/apk/release/app-release.apk
